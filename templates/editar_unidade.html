{% extends "base.html" %}

{% block title %}Editar Unidade | Almoxarifado{% endblock %}

{% block content %}
<section class="cabecalho-pagina">
    <div>
        <p class="texto-superior texto-superior--azul">EDIÇÃO</p>
        <h2>Editar unidade</h2>
        <p>Atualize as informações da unidade cadastrada.</p>
    </div>
</section>

<section class="painel painel--formulario">
    <form method="post" class="formulario">
        <div class="campo">
            <label for="codigo">Código da unidade *</label>
            <input
                type="text"
                id="codigo"
                name="codigo"
                value="{{ unidade['codigo'] }}"
                maxlength="20"
                required
            >
        </div>

        <div class="campo">
            <label for="nome">Nome da unidade *</label>
            <input
                type="text"
                id="nome"
                name="nome"
                value="{{ unidade['nome'] }}"
                required
            >
        </div>

        <div class="campo">
            <label for="grupo_rede">Grupo da rede *</label>

            <select id="grupo_rede" name="grupo_rede" required>
                <option value="">Selecione</option>

                <option
                    value="atencao_basica"
                    {% if unidade['grupo_rede'] == 'atencao_basica' %}selected{% endif %}
                >
                    Atenção Básica
                </option>

                <option
                    value="urgencia_emergencia"
                    {% if unidade['grupo_rede'] == 'urgencia_emergencia' %}selected{% endif %}
                >
                    Urgência e Emergência
                </option>

                <option
                    value="centros_especialidades_clinicas"
                    {% if unidade['grupo_rede'] == 'centros_especialidades_clinicas' %}selected{% endif %}
                >
                    Centros de Especialidades e Clínicas
                </option>

                <option
                    value="saude_mental"
                    {% if unidade['grupo_rede'] == 'saude_mental' %}selected{% endif %}
                >
                    Saúde Mental
                </option>

                <option
                    value="programas_especiais_suporte"
                    {% if unidade['grupo_rede'] == 'programas_especiais_suporte' %}selected{% endif %}
                >
                    Programas Especiais e Suporte
                </option>

                <option
                    value="estabelecimentos_penitenciarios"
                    {% if unidade['grupo_rede'] == 'estabelecimentos_penitenciarios' %}selected{% endif %}
                >
                    Estabelecimentos Penitenciários
                </option>
            </select>
        </div>

        <div class="campo">
            <label for="tipo_unidade">Tipo de unidade *</label>

            <select id="tipo_unidade" name="tipo_unidade" required>
                <option value="">Selecione</option>

                <option
                    value="ubs"
                    {% if unidade['tipo_unidade'] == 'ubs' %}selected{% endif %}
                >
                    UBS
                </option>

                <option
                    value="usf"
                    {% if unidade['tipo_unidade'] == 'usf' %}selected{% endif %}
                >
                    USF
                </option>

                <option
                    value="upa"
                    {% if unidade['tipo_unidade'] == 'upa' %}selected{% endif %}
                >
                    UPA
                </option>

                <option
                    value="caps"
                    {% if unidade['tipo_unidade'] == 'caps' %}selected{% endif %}
                >
                    CAPS
                </option>

                <option
                    value="samu"
                    {% if unidade['tipo_unidade'] == 'samu' %}selected{% endif %}
                >
                    SAMU
                </option>

                <option
                    value="sad"
                    {% if unidade['tipo_unidade'] == 'sad' %}selected{% endif %}
                >
                    SAD
                </option>

                <option
                    value="ist"
                    {% if unidade['tipo_unidade'] == 'ist' %}selected{% endif %}
                >
                    IST
                </option>

                <option
                    value="ambulatorio_saude_mental"
                    {% if unidade['tipo_unidade'] == 'ambulatorio_saude_mental' %}selected{% endif %}
                >
                    Ambulatório de Saúde Mental
                </option>

                <option
                    value="centro_especialidades"
                    {% if unidade['tipo_unidade'] == 'centro_especialidades' %}selected{% endif %}
                >
                    Centro de Especialidades
                </option>

                <option
                    value="clinica"
                    {% if unidade['tipo_unidade'] in ['clinica', 'clinica_fisioterapia'] %}selected{% endif %}
                >
                    Clínica
                </option>

                <option
                    value="secretaria_saude"
                    {% if unidade['tipo_unidade'] == 'secretaria_saude' %}selected{% endif %}
                >
                    Secretaria de Saúde
                </option>

                <option
                    value="penitenciaria_seguranca_media"
                    {% if unidade['tipo_unidade'] == 'penitenciaria_seguranca_media' %}selected{% endif %}
                >
                    Penitenciária de Segurança Média
                </option>

                <option
                    value="estabelecimento_penal_feminino"
                    {% if unidade['tipo_unidade'] == 'estabelecimento_penal_feminino' %}selected{% endif %}
                >
                    Estabelecimento Penal Feminino
                </option>

                <option
                    value="colonia_penal"
                    {% if unidade['tipo_unidade'] == 'colonia_penal' %}selected{% endif %}
                >
                    Colônia Penal
                </option>

                <option
                    value="outro"
                    {% if unidade['tipo_unidade'] == 'outro' %}selected{% endif %}
                >
                    Outro
                </option>
            </select>
        </div>

        <div class="campo">
            <label for="endereco">Endereço</label>
            <input
                type="text"
                id="endereco"
                name="endereco"
                value="{{ unidade['endereco'] or '' }}"
            >
        </div>

        <div class="acoes-formulario">
            <a class="botao botao--cancelar" href="{{ url_for('unidades') }}">
                Cancelar
            </a>

            <button class="botao botao--primario" type="submit">
                Salvar alterações
            </button>
        </div>
    </form>
</section>
{% endblock %}
