{% extends "base.html" %}

{% block title %}Editar Equipamento | Almoxarifado{% endblock %}

{% block content %}
<section class="cabecalho-pagina">
    <div>
        <p class="texto-superior texto-superior--azul">EDIÇÃO</p>
        <h2>Editar equipamento</h2>
        <p>Atualize as informações do equipamento clínico.</p>
    </div>
</section>

<section class="painel painel--formulario">
    <form method="post" class="formulario">
        <div class="campo">
            <label for="id_unidade">Unidade *</label>
            <select id="id_unidade" name="id_unidade" required>
                <option value="">Selecione</option>

                {% for unidade in unidades %}
                    <option
                        value="{{ unidade['id_unidade'] }}"
                        {% if unidade['id_unidade'] == equipamento['id_unidade'] %}selected{% endif %}
                    >
                        {{ unidade['codigo'] }} - {{ unidade['nome'] }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="campo">
            <label for="patrimonio">Patrimônio *</label>
            <input
                type="text"
                id="patrimonio"
                name="patrimonio"
                value="{{ equipamento['patrimonio'] }}"
                maxlength="30"
                required
            >
        </div>

        <div class="campo">
            <label for="nome">Nome do equipamento *</label>
            <input
                type="text"
                id="nome"
                name="nome"
                value="{{ equipamento['nome'] }}"
                required
            >
        </div>

        <div class="campo">
            <label for="modelo">Modelo</label>
            <input
                type="text"
                id="modelo"
                name="modelo"
                value="{{ equipamento['modelo'] or '' }}"
            >
        </div>

        <div class="campo">
            <label for="marca">Marca</label>
            <input
                type="text"
                id="marca"
                name="marca"
                value="{{ equipamento['marca'] or '' }}"
            >
        </div>

        <div class="campo">
            <label for="numero_serie">Número de série</label>
            <input
                type="text"
                id="numero_serie"
                name="numero_serie"
                value="{{ equipamento['numero_serie'] or '' }}"
            >
        </div>

        <div class="campo">
            <label for="data_entrada">Data de entrada</label>
            <input
                type="date"
                id="data_entrada"
                name="data_entrada"
                value="{{ equipamento['data_entrada'] or '' }}"
            >
        </div>

        <div class="campo">
            <label for="situacao">Situação *</label>
            <select id="situacao" name="situacao" required>
                <option value="">Selecione</option>
                <option value="Em uso" {% if equipamento['situacao'] == 'Em uso' %}selected{% endif %}>Em uso</option>
                <option value="Manutenção" {% if equipamento['situacao'] == 'Manutenção' %}selected{% endif %}>Manutenção</option>
                <option value="Quebrado" {% if equipamento['situacao'] == 'Quebrado' %}selected{% endif %}>Quebrado</option>
                <option value="Sucata" {% if equipamento['situacao'] == 'Sucata' %}selected{% endif %}>Sucata</option>
                <option value="Reserva" {% if equipamento['situacao'] == 'Reserva' %}selected{% endif %}>Reserva</option>
            </select>
        </div>

        <div class="campo">
            <label for="observacao">Observação</label>
            <textarea
                id="observacao"
                name="observacao"
                rows="4"
            >{{ equipamento['observacao'] or '' }}</textarea>
        </div>

        <div class="acoes-formulario">
            <a class="botao botao--cancelar" href="{{ url_for('equipamentos') }}">
                Cancelar
            </a>

            <button class="botao botao--primario" type="submit">
                Salvar alterações
            </button>
        </div>
    </form>
</section>
{% endblock %}
